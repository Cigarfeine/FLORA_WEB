<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" fill="none">
  <defs>
    <linearGradient id="m-stem" x1="300" y1="300" x2="300" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D5A3C"/>
      <stop offset="100%" stop-color="#1B3B26"/>
