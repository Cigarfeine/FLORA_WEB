    <path d="M62 338 C48 315, 68 285, 102 282 C115 265, 148 262, 168 275 C192 268, 222 282, 225 305 C232 325, 212 345, 185 346 C158 352, 115 352, 85 346 C72 345, 66 342, 62 338 Z" fill="url(#b-canopy-dark)"/>
