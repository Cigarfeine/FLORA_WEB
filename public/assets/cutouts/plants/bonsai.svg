  </g>

  <!-- Mid Right Foliage Pad -->
  <g filter="url(#b-shadow)">
    <path d="M352 292 C338 268, 358 238, 395 232 C412 212, 452 210, 478 228 C508 222, 542 242, 542 268 C545 292, 520 310, 488 310 C452 316, 398 315, 368 305 C358 302, 355 298, 352 292 Z" fill="url(#b-canopy-dark)"/>
    <path d="M364 278 C354 258, 372 238, 404 235 C420 218, 455 216, 476 232 C502 228, 528 244, 528 264 C528 282, 505 294, 475 294 C440 298, 392 296, 364 278 Z" fill="url(#b-canopy-light)"/>
  </g>

  <!-- Upper Left Foliage Pad -->
  <g filter="url(#b-shadow)">
    <path d="M135 222 C122 198, 142 172, 175 168 C192 150, 228 148, 252 162 C278 158, 305 174, 305 196 C308 216, 285 232, 255 232 C222 238, 175 236, 148 228 Z" fill="url(#b-canopy-mid)"/>
