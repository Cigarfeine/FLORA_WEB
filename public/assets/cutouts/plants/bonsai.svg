    <!-- Right Branch -->
    <path d="M295 275 C345 268, 395 275, 438 292 L445 276 C402 255, 352 246, 305 252 Z" fill="url(#b-trunk)"/>
    <!-- Bark Texture Lines -->
    <path d="M285 585 C298 550, 295 515, 280 480 M242 405 C232 375, 245 342, 275 315 M302 280 C322 252, 330 222, 320 190" stroke="#3B2615" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Lower Left Foliage Pad -->
