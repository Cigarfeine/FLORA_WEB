<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" fill="none">
  <defs>
    <linearGradient id="b-trunk" x1="220" y1="220" x2="380" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8C6747"/>
      <stop offset="45%" stop-color="#6B4C32"/>
      <stop offset="100%" stop-color="#47311E"/>
    </linearGradient>
    <linearGradient id="b-canopy-dark" x1="120" y1="120" x2="480" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#295235"/>
      <stop offset="100%" stop-color="#16301E"/>
    </linearGradient>
    <linearGradient id="b-canopy-mid" x1="140" y1="80" x2="460" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3F754C"/>
      <stop offset="100%" stop-color="#234B2D"/>
    </linearGradient>
    <linearGradient id="b-canopy-light" x1="160" y1="60" x2="440" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#619B6B"/>
      <stop offset="60%" stop-color="#3B7047"/>
      <stop offset="100%" stop-color="#275031"/>
    </linearGradient>
    <filter id="b-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0E1E13" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Moss Base Mound -->
  <path d="M210 605 C235 578, 365 578, 390 605 Z" fill="#4B7F47"/>

