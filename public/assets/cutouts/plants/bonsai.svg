    <path d="M192 148 C175 120, 198 85, 238 80 C258 58, 308 55, 338 75 C372 68, 408 92, 408 122 C412 148, 382 168, 345 168 C302 175, 238 172, 205 158 Z" fill="url(#b-canopy-dark)"/>
    <path d="M206 134 C194 110, 214 86, 248 82 C266 64, 310 62, 336 78 C365 74, 394 94, 394 116 C394 136, 368 150, 334 150 C292 155, 236 152, 206 134 Z" fill="url(#b-canopy-light)"/>
    <!-- Fine Needle Highlights -->
    <path d="M245 98 Q260 88 275 98 M295 92 Q312 82 328 92 M342 108 Q358 98 372 108 M105 302 Q122 292 138 302 M152 298 Q168 288 184 298 M405 252 Q422 242 438 252 M458 248 Q475 238 492 248" stroke="#8FD19B" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
