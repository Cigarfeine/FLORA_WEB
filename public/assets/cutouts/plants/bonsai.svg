    <path d="M235 605 C265 585, 285 555, 275 510 C262 455, 205 420, 215 355 C225 295, 295 268, 315 215 C325 185, 310 155, 290 135 L312 130 C338 155, 355 190, 345 228 C328 285, 262 312, 255 362 C248 412, 308 448, 322 508 C332 552, 345 585, 372 605 Z" fill="url(#b-trunk)"/>
    <!-- Left Branch -->
