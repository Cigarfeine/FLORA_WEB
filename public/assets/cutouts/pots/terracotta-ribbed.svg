<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" fill="none">
  <defs>
    <linearGradient id="tc-body" x1="85" y1="55" x2="415" y2="395" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97F54"/>
      <stop offset="40%" stop-color="#C2643B"/>
      <stop offset="80%" stop-color="#9E4B28"/>
      <stop offset="100%" stop-color="#783519"/>
    </linearGradient>
    <linearGradient id="tc-rim" x1="90" y1="45" x2="410" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E59168"/>
      <stop offset="55%" stop-color="#C76940"/>
      <stop offset="100%" stop-color="#8C4020"/>
    </linearGradient>
    <linearGradient id="tc-soil" x1="120" y1="55" x2="380" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#281C14"/>
      <stop offset="50%" stop-color="#3B2A1E"/>
      <stop offset="100%" stop-color="#1E140E"/>
    </linearGradient>
    <filter id="tc-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#1A0E08" flood-opacity="0.32"/>
    </filter>
  </defs>

  <ellipse cx="250" cy="402" rx="132" ry="18" fill="#1A0E08" opacity="0.28"/>

  <g filter="url(#tc-shadow)">
    <!-- Tapered Artisan Terracotta Cylinder -->
    <path d="M102 74 L142 386 C148 402, 352 402, 358 386 L398 74 Z" fill="url(#tc-body)"/>

    <!-- Rolled Collar Band -->
    <path d="M94 68 L100 106 C105 118, 395 118, 400 106 L406 68 Z" fill="url(#tc-rim)"/>

    <!-- Vertical Fluted Terracotta Ridges -->
    <g stroke="#F0A884" stroke-width="2" opacity="0.32" stroke-linecap="round">
      <line x1="132" y1="116" x2="158" y2="384"/>
      <line x1="162" y1="118" x2="182" y2="388"/>
      <line x1="192" y1="120" x2="206" y2="392"/>
      <line x1="222" y1="121" x2="228" y2="394"/>
      <line x1="250" y1="122" x2="250" y2="395"/>
      <line x1="278" y1="121" x2="272" y2="394"/>
      <line x1="308" y1="120" x2="294" y2="392"/>
      <line x1="338" y1="118" x2="318" y2="388"/>
      <line x1="368" y1="116" x2="342" y2="384"/>
    </g>

    <!-- Rim & Soil -->
    <ellipse cx="250" cy="68" rx="156" ry="22" fill="url(#tc-rim)"/>
    <ellipse cx="250" cy="68" rx="142" ry="16" fill="url(#tc-soil)"/>
    <path d="M94 68 A156 22 0 0 0 406 68" stroke="url(#tc-rim)" stroke-width="6" fill="none"/>
  </g>
</svg>
