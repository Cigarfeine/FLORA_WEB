<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" fill="none">
  <defs>
    <linearGradient id="if-body" x1="90" y1="55" x2="410" y2="395" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="45%" stop-color="#EFE9DC"/>
      <stop offset="80%" stop-color="#DDD4C3"/>
      <stop offset="100%" stop-color="#C4B9A5"/>
    </linearGradient>
    <linearGradient id="if-rim" x1="95" y1="45" x2="405" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F2ECE0"/>
      <stop offset="100%" stop-color="#CFC5B2"/>
    </linearGradient>
    <linearGradient id="if-soil" x1="120" y1="55" x2="380" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#281D15"/>
      <stop offset="50%" stop-color="#3A2B20"/>
      <stop offset="100%" stop-color="#1E150F"/>
    </linearGradient>
    <filter id="if-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#171612" flood-opacity="0.28"/>
    </filter>
  </defs>

  <ellipse cx="250" cy="402" rx="134" ry="18" fill="#171612" opacity="0.24"/>

  <g filter="url(#if-shadow)">
