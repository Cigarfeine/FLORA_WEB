      <line x1="126" y1="88" x2="136" y2="375"/>
      <line x1="150" y1="90" x2="158" y2="382"/>
      <line x1="174" y1="92" x2="180" y2="388"/>
      <line x1="198" y1="93" x2="202" y2="392"/>
      <line x1="224" y1="94" x2="226" y2="394"/>
      <line x1="250" y1="94" x2="250" y2="395"/>
      <line x1="276" y1="94" x2="274" y2="394"/>
      <line x1="302" y1="93" x2="298" y2="392"/>
      <line x1="326" y1="92" x2="320" y2="388"/>
      <line x1="350" y1="90" x2="342" y2="382"/>
      <line x1="374" y1="88" x2="364" y2="375"/>
    </g>
    <g stroke="#C2B7A3" stroke-width="1.8" opacity="0.45" stroke-linecap="round">
      <line x1="138" y1="89" x2="147" y2="378"/>
      <line x1="162" y1="91" x2="169" y2="385"/>
      <line x1="186" y1="92" x2="191" y2="390"/>
      <line x1="211" y1="93" x2="214" y2="393"/>
      <line x1="237" y1="94" x2="238" y2="394"/>
      <line x1="263" y1="94" x2="262" y2="394"/>
      <line x1="289" y1="93" x2="286" y2="393"/>
      <line x1="314" y1="92" x2="309" y2="390"/>
      <line x1="338" y1="91" x2="331" y2="385"/>
      <line x1="362" y1="89" x2="353" y2="378"/>
    </g>

    <!-- Rim & Soil -->
    <ellipse cx="250" cy="68" rx="146" ry="22" fill="url(#if-rim)"/>
    <ellipse cx="250" cy="68" rx="134" ry="16" fill="url(#if-soil)"/>
    <path d="M104 68 A146 22 0 0 0 396 68" stroke="url(#if-rim)" stroke-width="6" fill="none"/>
